name: Desktop distribution

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-distribution-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows:
    if: github.repository == 'Ethan-decoy/QuestBranch' && github.ref == 'refs/heads/main'
    runs-on: windows-2025
    timeout-minutes: 45
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
      - run: npm install --global pnpm@11.1.3 --ignore-scripts
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: node node_modules/electron/install.js
      - run: pnpm check
      - run: pnpm verify:session-package
      - name: Build final installer and application
        run: pnpm package:win
      - run: pnpm notices:check
      - name: Verify packaged runtime, native agent and OM SDK
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path artifacts/release-evidence -Force | Out-Null
          $env:ELECTRON_RUN_AS_NODE = '1'
          try {
            foreach ($qbCheck in @(@('scripts/verify-package-integrity.mjs','package-runtime'),@('scripts/verify-session-runtime.mjs','session-runtime'))) {
              $qbProcess = Start-Process -FilePath ./release/win-unpacked/QuestBranch.exe -ArgumentList $qbCheck[0] -WindowStyle Hidden -Wait -PassThru -RedirectStandardOutput "artifacts/release-evidence/$($qbCheck[1]).stdout.log" -RedirectStandardError "artifacts/release-evidence/$($qbCheck[1]).stderr.log"
              if ($qbProcess.ExitCode -ne 0) { Get-Content "artifacts/release-evidence/$($qbCheck[1]).stderr.log" -Tail 30; throw 'Packaged runtime verification failed' }
            }
          } finally { Remove-Item Env:ELECTRON_RUN_AS_NODE -ErrorAction SilentlyContinue }
      - name: Fresh install, published predecessor upgrade and uninstall
        shell: pwsh
        run: |
          $qbVersion = (Get-Content package.json -Raw | ConvertFrom-Json).version
          ./scripts/verify-windows-installer.ps1 -Installer "release/QuestBranch-Setup-$qbVersion-x64.exe"
          ./scripts/assemble-windows-release.ps1
          Move-Item -LiteralPath release/VERIFICATION.json -Destination release/VERIFICATION-windows-x64.json
      - name: Verify packaged update SDK download, proxy and checksum rejection
        shell: pwsh
        run: |
          $qbProcess = Start-Process -FilePath ./node_modules/electron/dist/electron.exe -ArgumentList @('scripts/verify-updates.mjs','--package-root=release/win-unpacked') -WindowStyle Hidden -Wait -PassThru -RedirectStandardOutput artifacts/release-evidence/update-sdk.stdout.log -RedirectStandardError artifacts/release-evidence/update-sdk.stderr.log
          if ($qbProcess.ExitCode -ne 0) { Get-Content artifacts/release-evidence/update-sdk.stderr.log -Tail 30; throw 'Update SDK verification failed' }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: questbranch-desktop-windows-x64-${{ github.sha }}
          compression-level: 0
          retention-days: 1
          if-no-files-found: error
          path: |
            release/QuestBranch-Setup-*-x64.exe
            release/QuestBranch-*-windows-x64.zip
            release/QuestBranch-Setup-*-x64.exe.blockmap
            release/*.yml
            !release/builder-debug.yml
            release/VERIFICATION-windows-x64.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: desktop-acceptance-windows-x64-${{ github.sha }}
          retention-days: 7
          path: artifacts/release-evidence/

  native:
    if: github.repository == 'Ethan-decoy/QuestBranch' && github.ref == 'refs/heads/main'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            target: macos-arm64
            command: pnpm package:mac --arm64
          - os: macos-15-intel
            target: macos-x64
            command: pnpm package:mac --x64
          - os: ubuntu-24.04
            target: linux-x64
            command: pnpm package:linux
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
      - run: npm install --global pnpm@11.1.3 --ignore-scripts
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: node node_modules/electron/install.js
      - run: pnpm check
      - run: pnpm verify:session-package
      - name: Build final native packages and platform notices
        run: ${{ matrix.command }}
      - run: pnpm notices:check
      - name: Prepare Linux graphical test session
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y xvfb dbus-x11 xdotool fonts-noto-cjk libgtk-3-0t64 libnotify4 libnss3 libasound2t64
          sudo chown root:root node_modules/electron/dist/chrome-sandbox
          sudo chmod 4755 node_modules/electron/dist/chrome-sandbox
      - name: Install and verify native packages on macOS
        if: runner.os == 'macOS'
        run: node scripts/verify-posix-package.mjs
      - name: Install and verify native packages on Linux
        if: runner.os == 'Linux'
        run: dbus-run-session -- xvfb-run --auto-servernum node scripts/verify-posix-package.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: questbranch-desktop-${{ matrix.target }}-${{ github.sha }}
          compression-level: 0
          retention-days: 1
          if-no-files-found: error
          path: |
            release/QuestBranch-*.dmg
            release/QuestBranch-*.deb
            release/QuestBranch-*.AppImage
            release/*-linux.yml
            release/VERIFICATION-${{ matrix.target }}.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: desktop-acceptance-${{ matrix.target }}-${{ github.sha }}
          retention-days: 7
          path: artifacts/release-evidence/

  acceptance:
    if: github.repository == 'Ethan-decoy/QuestBranch' && github.ref == 'refs/heads/main'
    needs: [windows, native]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: questbranch-desktop-*-${{ github.sha }}
          merge-multiple: true
          path: release
      - name: Require all native acceptance records and hash final assets
        run: |
          npm install --global pnpm@11.1.3 --ignore-scripts
          pnpm install --frozen-lockfile --ignore-scripts
          node scripts/assemble-desktop-release.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: questbranch-release-metadata-${{ github.sha }}
          retention-days: 1
          if-no-files-found: error
          path: |
            release/README-TRIAL.md
            release/RELEASE-NOTES.md
            release/VERIFICATION.json
            release/SHA256SUMS.txt

  publish:
    if: github.repository == 'Ethan-decoy/QuestBranch' && startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-2025
    timeout-minutes: 30
    permissions:
      actions: read
      contents: write
    outputs:
      candidate_run: ${{ steps.candidate.outputs.run_id }}
      source_commit: ${{ steps.candidate.outputs.source_commit }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Find accepted main build for this exact source commit
        id: candidate
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $qbCommit = (& git rev-parse HEAD).Trim()
          $qbRuns = & gh api "repos/$env:GITHUB_REPOSITORY/actions/workflows/desktop-release.yml/runs?head_sha=$qbCommit&event=push&status=success&per_page=20" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw 'Unable to find candidate runs' }
          $qbRun = $qbRuns.workflow_runs | Where-Object { $_.head_sha -eq $qbCommit -and $_.head_branch -eq 'main' -and $_.conclusion -eq 'success' } | Select-Object -First 1
          if (-not $qbRun) { throw 'No accepted desktop candidate exists for this exact commit' }
          "run_id=$($qbRun.id)" >> $env:GITHUB_OUTPUT
          "source_commit=$qbCommit" >> $env:GITHUB_OUTPUT
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: questbranch-desktop-*-${{ steps.candidate.outputs.source_commit }}
          merge-multiple: true
          run-id: ${{ steps.candidate.outputs.run_id }}
          github-token: ${{ github.token }}
          path: release
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: questbranch-release-metadata-${{ steps.candidate.outputs.source_commit }}
          run-id: ${{ steps.candidate.outputs.run_id }}
          github-token: ${{ github.token }}
          path: release
      - name: Draft, upload, download-verify, and publish accepted bytes
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: ./scripts/publish-desktop-release.ps1 -CandidateRunId '${{ steps.candidate.outputs.run_id }}'

  retire-installers:
    if: github.repository == 'Ethan-decoy/QuestBranch' && startsWith(github.ref, 'refs/tags/v')
    needs: publish
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
      - run: npm install --global pnpm@11.1.3 --ignore-scripts
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: questbranch-release-metadata-${{ needs.publish.outputs.source_commit }}
          run-id: ${{ needs.publish.outputs.candidate_run }}
          github-token: ${{ github.token }}
          path: release
      - name: Retire only installers older than the authorized dev.9 cutoff
        env:
          GH_TOKEN: ${{ github.token }}
        # 2026-11-13 authorization is bounded to versions below dev.9.
        # Later versions do not extend this retirement cutoff automatically.
        run: node scripts/retire-desktop-installers.mjs --before=0.3.0-dev.9
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: installer-retirement-${{ github.sha }}
          retention-days: 7
          path: artifacts/release-evidence/installer-retirement.json
